name: Regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run callback regression tests
        run: python -m pytest -q
      - name: Check runtime syntax and errors
        run: python -m ruff check --select E9,F63,F7,F82 custom_components/view_assist/devices/entity_listeners.py
      - name: Lint tests
        run: python -m ruff check tests
      - name: Check formatting
        run: python -m ruff format --check custom_components/view_assist/devices/entity_listeners.py tests
